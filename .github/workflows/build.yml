name: Build and Release Lyrics

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all documents
        run: make

      - name: Package PDFs
        run: tar czf lyrics.tar.gz -C out .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lyrics.tar.gz
          body: "Compiled lyrics PDFs"
